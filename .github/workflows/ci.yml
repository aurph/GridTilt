name: CI

# Runs the checks that previously only ran when someone remembered. The repo's
# defence against the data-integrity defects fixed in this release is a set of
# tests, and a test with no trigger is not a defence.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # 22 is what Replit runs. Testing on anything else tests a build that
      # never ships.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      # Includes facility-filter-consistency, which fails if a surface reads
      # /api/datacenters without the 400 MW floor.
      - name: Test
        run: npm test

      # A green test suite with a broken build still cannot deploy.
      - name: Build
        run: npm run build

      # Reports only. The score is low and the remaining findings need
      # judgement rather than a switch, so failing the build on it would just
      # block every PR. Rule overrides and their reasons live in
      # .aislop/config.yml. Turn this into a gate once the score is defensible.
      - name: Slop scan
        run: npx --yes aislop@0.14.1 scan .
        continue-on-error: true

      # This one does fail the build. Nothing here needs judgement: a new high
      # advisory is either fixable or it is a decision someone has to record.
      - name: Audit
        run: npm audit --audit-level=high
